<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Airport Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 24px;">✈️</div>
      <h2 class="brand-title">Create AMS Account</h2>
      <p class="brand-sub">Register for Passenger or Operations Access</p>
    </div>

    <div id="error-msg" class="error-msg" style="display:none;"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="name">Full Legal Name</label>
        <input type="text" id="name" placeholder="Captain Vikram Singh" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="vikram@ams.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="role">Account Role</label>
        <select id="role" required>
          <option value="passenger" selected>Passenger (Flight Booking & Baggage Portal)</option>
          <option value="staff">Airport Operations Staff (Gate & Status Control)</option>
        </select>
      </div>

      <div class="form-group" id="passport-group">
        <label for="passport">Passport / National ID (Optional)</label>
        <input type="text" id="passport" placeholder="e.g. M9920145">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+91-98765-43210" required>
      </div>

      <button type="submit" id="reg-submit-btn" style="width: 100%;">Create Account</button>
    </form>

    <p style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted);">
      Already have an account? <a href="login.html">Sign In here</a>
    </p>
  </div>

  <script src="script.js"></script>
  <script>
    checkAuth();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const btn = document.getElementById('reg-submit-btn');
      btn.textContent = 'Registering...';
      btn.disabled = true;

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const passport_number = document.getElementById('passport').value.trim();
      const phone_number = document.getElementById('phone').value.trim();

      try {
        const data = await apiCall('/auth/register', 'POST', {
          name,
          email,
          password,
          role,
          passport_number: passport_number || undefined,
          phone_number: phone_number || undefined,
        });

        localStorage.setItem('ams_token', data.token);
        localStorage.setItem('ams_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message || 'Registration failed');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
