services:
  - type: web
    name: airport-management-system
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: airport-management-system-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: airport-management-system-db
    plan: free
    databaseName: airport_management_system
    user: ams_user
